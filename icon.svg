<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d5b78"/>
      <stop offset="50%" stop-color="#834360"/>
      <stop offset="100%" stop-color="#c59b6b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado estilo App móvil -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Círculo interior elegante -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>
  
  <!-- Icono de Peluquería & Finanzas (Tijeras estilizadas + Gota de químico/onza) -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Tijeras de salón -->
    <circle cx="160" cy="160" r="50"/>
    <circle cx="160" cy="352" r="50"/>
    <line x1="390" y1="120" x2="198" y2="312"/>
    <line x1="305" y1="285" x2="390" y2="392"/>
    <line x1="198" y1="200" x2="265" y2="265"/>
  </g>
  
  <!-- Destello de calidad -->
  <path d="M370 210 L380 235 L405 245 L380 255 L370 280 L360 255 L335 245 L360 235 Z" fill="#ffd166"/>
</svg>
